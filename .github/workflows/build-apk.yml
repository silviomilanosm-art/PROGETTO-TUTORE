name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Decode stable signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > app-signing.jks

      - name: Sign APK for in-place updates
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks app-signing.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out ProgettoTutore-update.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose ProgettoTutore-update.apk

      - name: Build debug fallback
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: gradle :app:assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ProgettoTutore-update.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProgettoTutore-${{ github.run_number }}
          path: ProgettoTutore-update.apk
          retention-days: 90
